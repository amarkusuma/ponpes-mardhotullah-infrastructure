name: Build & Push Images

# Build image Docker untuk backend, cms, dan web dari repo masing-masing,
# lalu push ke GitHub Container Registry (ghcr.io/<owner>/ponpes-<service>).
#
# Trigger:
#   - Manual  : tab Actions → "Build & Push Images" → Run workflow
#               (centang "deploy" untuk langsung deploy ke VPS setelah build)
#   - Dari repo aplikasi (repository_dispatch):
#       curl -X POST -H "Authorization: Bearer <PAT>" \
#         https://api.github.com/repos/<owner>/ponpes-mardhotullah-infrastructure/dispatches \
#         -d '{"event_type":"build","client_payload":{"service":"backend","ref":"main"}}'

on:
  workflow_dispatch:
    inputs:
      service:
        description: Service yang di-build
        type: choice
        options: [all, backend, cms, web]
        default: all
      ref:
        description: Branch/tag/SHA di repo aplikasi (kosong/main/master = default branch masing-masing repo)
        type: string
        default: ''
      deploy:
        description: Deploy ke VPS setelah build sukses (hanya untuk build default branch)
        type: boolean
        default: false
  repository_dispatch:
    types: [build]

concurrency:
  group: build-${{ github.event.inputs.service || github.event.client_payload.service || 'all' }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  SERVICE: ${{ github.event.inputs.service || github.event.client_payload.service || 'all' }}
  REF: ${{ github.event.inputs.ref || github.event.client_payload.ref || '' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: matrix
        run: |
          # branch = default branch tiap repo (web memakai master)
          all='[
            {"service":"backend","repo":"ponpes-mardhotullah-backend","branch":"main"},
            {"service":"cms","repo":"ponpes-mardhotullah-cms","branch":"main"},
            {"service":"web","repo":"ponpes-mardhotullah-web","branch":"master"}
          ]'
          case "$SERVICE" in
            all|backend|cms|web) ;;
            *) echo "::error::service tidak dikenal: $SERVICE"; exit 1 ;;
          esac
          matrix=$(echo "$all" | jq -c --arg s "$SERVICE" '[.[] | select($s == "all" or .service == $s)]')
          echo "matrix={\"include\":$matrix}" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      # REF kosong/main/master = "default branch" → diterjemahkan ke branch tiap repo,
      # supaya `service: all` + `ref: main` tidak gagal di repo web (master).
      # Ref lain (branch fitur, tag, SHA) dipakai apa adanya.
      - id: ref
        env:
          BRANCH: ${{ matrix.branch }}
        run: |
          case "$REF" in
            ''|main|master) ref="$BRANCH" ;;
            *) ref="$REF" ;;
          esac
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "is_default=$([ "$ref" = "$BRANCH" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Checkout ${{ matrix.repo }}@${{ steps.ref.outputs.ref }}
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/${{ matrix.repo }}
          ref: ${{ steps.ref.outputs.ref }}
          # PAT (fine-grained, Contents: read) untuk repo aplikasi yang private
          token: ${{ secrets.REPO_TOKEN || github.token }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/ponpes-${{ matrix.service }}
          # latest hanya untuk build dari default branch repo tsb
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable=${{ steps.ref.outputs.is_default }}

      # Hanya variable yang diisi yang dikirim sebagai build-arg; sisanya pakai default di Dockerfile
      # (domain mardhotullah.com). NEXT_PUBLIC_* di-bake saat build → ganti nilai = build ulang.
      - id: args
        if: matrix.service == 'web'
        env:
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_LOGIN_URL: ${{ vars.NEXT_PUBLIC_LOGIN_URL }}
          NEXT_PUBLIC_PPDB_URL: ${{ vars.NEXT_PUBLIC_PPDB_URL }}
          NEXT_PUBLIC_WHATSAPP_NUMBER: ${{ vars.NEXT_PUBLIC_WHATSAPP_NUMBER }}
        run: |
          {
            echo 'list<<EOF'
            for k in NEXT_PUBLIC_APP_URL NEXT_PUBLIC_LOGIN_URL NEXT_PUBLIC_PPDB_URL NEXT_PUBLIC_WHATSAPP_NUMBER; do
              [ -n "${!k}" ] && echo "$k=${!k}"
            done
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
          build-args: ${{ steps.args.outputs.list }}

      - name: Summary
        run: |
          {
            echo "### ponpes-${{ matrix.service }} (${{ matrix.repo }}@${{ steps.ref.outputs.ref }})"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Deploy tag `latest`, jadi hanya masuk akal untuk build dari default branch
  # (ref lain tidak memperbarui `latest`).
  deploy:
    needs: build
    if: >-
      github.event.inputs.deploy == 'true' &&
      (github.event.inputs.ref == '' || github.event.inputs.ref == 'main' || github.event.inputs.ref == 'master')
    uses: ./.github/workflows/deploy.yml
    with:
      image_tag: latest
    secrets: inherit
