# Stack production Ponpes Mardhotullah.
# Image dibuild oleh workflow .github/workflows/build-images.yml.
#
# Stack ini TIDAK menjalankan Traefik sendiri: ia menumpang Traefik milik stack
# NuSewa (nusewa_traefik, port 80/443) lewat network eksternal `traefik_public`.
# Stack NuSewa harus sudah jalan lebih dulu.
#
#   cp .env.example .env   # isi nilainya
#   docker compose pull && docker compose up -d
#
# Routing (HTTPS otomatis via certresolver `letsencrypt` milik Traefik NuSewa):
#   https://${DOMAIN}          → ponpes-web
#   https://www.${DOMAIN}      → redirect ke https://${DOMAIN}
#   https://cms.${DOMAIN}      → ponpes-cms
#   https://api.${DOMAIN}      → ponpes-backend
#
# Aturan supaya tidak bentrok dengan NuSewa (satu Traefik & satu network bersama):
#   - Nama service diberi prefix `ponpes-`: service di traefik_public saling bisa
#     resolve by name, dan NuSewa sudah memakai `backend`, `cms`, `web`, `minio`.
#   - Nama router/service/middleware Traefik juga diberi prefix `ponpes-`:
#     nama yang sama di dua stack membuat Traefik menonaktifkan keduanya.

name: ponpes

services:
  ponpes-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 5
    networks: [internal]

  ponpes-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60 1", "--loglevel", "warning"]
    volumes:
      - redis_data:/data
    networks: [internal]

  ponpes-minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      retries: 5
    ports:
      - '127.0.0.1:9011:9001' # console, akses lewat SSH tunnel
    networks: [internal]

  # Kalau DB/MinIO belum siap saat start, backend exit (fatal) lalu di-restart
  # otomatis oleh `restart: unless-stopped` sampai koneksinya berhasil.
  ponpes-backend:
    image: ghcr.io/${GHCR_OWNER}/ponpes-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      ponpes-postgres:
        condition: service_healthy
      ponpes-redis:
        condition: service_started
      ponpes-minio:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@ponpes-postgres:5432/${POSTGRES_DB}?sslmode=disable
      REDIS_ADDR: ponpes-redis:6379
      REDIS_PASSWORD: ''
      JWT_SECRET: ${JWT_SECRET}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ALLOWED_ORIGINS: https://${DOMAIN},https://www.${DOMAIN},https://cms.${DOMAIN}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-6h}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-168h}
      MINIO_ENDPOINT: ponpes-minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-ponpes}
      MINIO_USE_SSL: 'false'
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik_public
      - traefik.http.routers.ponpes-api.rule=Host(`api.${DOMAIN}`)
      - traefik.http.routers.ponpes-api.entrypoints=websecure
      - traefik.http.routers.ponpes-api.tls.certresolver=letsencrypt
      - traefik.http.routers.ponpes-api.service=ponpes-api
      - traefik.http.services.ponpes-api.loadbalancer.server.port=8080
    networks: [internal, traefik_public]

  ponpes-cms:
    image: ghcr.io/${GHCR_OWNER}/ponpes-cms:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on: [ponpes-backend]
    environment:
      API_BASE_URL: http://ponpes-backend:8080/api
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik_public
      - traefik.http.routers.ponpes-cms.rule=Host(`cms.${DOMAIN}`)
      - traefik.http.routers.ponpes-cms.entrypoints=websecure
      - traefik.http.routers.ponpes-cms.tls.certresolver=letsencrypt
      - traefik.http.routers.ponpes-cms.service=ponpes-cms
      - traefik.http.services.ponpes-cms.loadbalancer.server.port=3000
    networks: [internal, traefik_public]

  ponpes-web:
    image: ghcr.io/${GHCR_OWNER}/ponpes-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on: [ponpes-backend]
    environment:
      API_BASE_URL: http://ponpes-backend:8080/api
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik_public
      - traefik.http.routers.ponpes-web.rule=Host(`${DOMAIN}`) || Host(`www.${DOMAIN}`)
      - traefik.http.routers.ponpes-web.entrypoints=websecure
      - traefik.http.routers.ponpes-web.tls.certresolver=letsencrypt
      - traefik.http.routers.ponpes-web.service=ponpes-web
      - traefik.http.routers.ponpes-web.middlewares=ponpes-www-redirect
      - traefik.http.middlewares.ponpes-www-redirect.redirectregex.regex=^https://www\.(.+)
      - traefik.http.middlewares.ponpes-www-redirect.redirectregex.replacement=https://$${1}
      - traefik.http.middlewares.ponpes-www-redirect.redirectregex.permanent=true
      - traefik.http.services.ponpes-web.loadbalancer.server.port=3000
    networks: [internal, traefik_public]

networks:
  internal:
    name: ponpes_internal
  # Dibuat oleh stack NuSewa (nusewa-infrastructure)
  traefik_public:
    external: true

volumes:
  postgres_data:
    name: ponpes_postgres_data
  redis_data:
    name: ponpes_redis_data
  minio_data:
    name: ponpes_minio_data
