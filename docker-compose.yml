# Stack production Ponpes Mardhotullah.
# Image dibuild oleh workflow .github/workflows/build-images.yml.
#
#   cp .env.example .env   # isi nilainya
#   docker compose pull && docker compose up -d
#
# Routing (Traefik, HTTPS otomatis via Let's Encrypt):
#   https://${DOMAIN}          → web
#   https://www.${DOMAIN}      → redirect ke https://${DOMAIN}
#   https://cms.${DOMAIN}      → cms
#   https://api.${DOMAIN}      → backend

services:
  traefik:
    image: traefik:v3.6
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=ponpes_proxy
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls.certresolver=letsencrypt
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --log.level=INFO
      - --accesslog=true
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    networks: [proxy]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 5
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60 1", "--loglevel", "warning"]
    volumes:
      - redis_data:/data
    networks: [internal]

  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    ports:
      - '127.0.0.1:9001:9001' # console, akses lewat SSH tunnel
    networks: [internal]

  backend:
    image: ghcr.io/${GHCR_OWNER}/ponpes-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ''
      JWT_SECRET: ${JWT_SECRET}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ALLOWED_ORIGINS: https://${DOMAIN},https://cms.${DOMAIN}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-6h}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-168h}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-ponpes}
      MINIO_USE_SSL: 'false'
    labels:
      - traefik.enable=true
      - traefik.http.routers.backend.rule=Host(`api.${DOMAIN}`)
      - traefik.http.routers.backend.entrypoints=websecure
      - traefik.http.services.backend.loadbalancer.server.port=8080
    networks: [internal, proxy]

  cms:
    image: ghcr.io/${GHCR_OWNER}/ponpes-cms:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on: [backend]
    environment:
      API_BASE_URL: http://backend:8080/api
    labels:
      - traefik.enable=true
      - traefik.http.routers.cms.rule=Host(`cms.${DOMAIN}`)
      - traefik.http.routers.cms.entrypoints=websecure
      - traefik.http.services.cms.loadbalancer.server.port=3000
    networks: [internal, proxy]

  web:
    image: ghcr.io/${GHCR_OWNER}/ponpes-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on: [backend]
    environment:
      API_BASE_URL: http://backend:8080/api
    labels:
      - traefik.enable=true
      - traefik.http.routers.web.rule=Host(`${DOMAIN}`) || Host(`www.${DOMAIN}`)
      - traefik.http.routers.web.entrypoints=websecure
      - traefik.http.routers.web.middlewares=www-to-apex
      - traefik.http.middlewares.www-to-apex.redirectregex.regex=^https://www\.(.+)
      - traefik.http.middlewares.www-to-apex.redirectregex.replacement=https://$${1}
      - traefik.http.middlewares.www-to-apex.redirectregex.permanent=true
      - traefik.http.services.web.loadbalancer.server.port=3000
    networks: [internal, proxy]

networks:
  internal: {}
  proxy:
    name: ponpes_proxy

volumes:
  postgres_data: {}
  redis_data: {}
  minio_data: {}
  letsencrypt: {}
